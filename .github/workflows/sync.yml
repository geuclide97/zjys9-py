name: Sync upstream

on:
  schedule:
    # 每 12 小时同步一次（UTC 时间）
    - cron: "0 */12 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Run sync
        run: python sync.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: 从上游自动更新"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Notify haitun
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.HAITUN_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/geuclide97/haitun/dispatches \
            -d '{"event_type":"zjys9-updated"}'
